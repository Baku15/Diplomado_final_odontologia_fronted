<div class="modal-backdrop">
  <div class="modal">

    <h2>Crear cita</h2>

    <div class="field">
      <label>Fecha</label>
      <input type="text" [value]="date" disabled>
    </div>

    <div class="field">
      <label>Hora inicio</label>
      <input type="text" [value]="startTime" disabled>
    </div>
    <div class="section">
      <h3>Duración de la cita</h3>

      <div class="duration-control">
        <button type="button" (click)="decreaseDuration()">−</button>

        <div class="duration-value">
          <strong>{{ durationMinutes }}</strong>
          <span>minutos</span>
        </div>

        <button type="button" (click)="increaseDuration()">+</button>
      </div>

      <div class="duration-meta">
        <span>{{ durationMinutes / 60 | number:'1.0-1' }} horas</span>
        <span>• STEP {{ STEP_MINUTES }} min</span>
      </div>
    </div>


    <div class="field">
      <label>Hora fin</label>
      <input type="text" [value]="endTime" disabled>
    </div>

    <div class="field">
      <label>Motivo</label>
      <textarea
        [(ngModel)]="reason"
        rows="2"
        placeholder="Ej: Cirugía de implante, tratamiento prolongado…"
      ></textarea>
    </div>

    <hr>

    <h4>Recordatorios</h4>

    <label class="checkbox">
      <input type="checkbox" [(ngModel)]="sendEmail">
      Enviar correo electrónico
    </label>

    <label class="checkbox">
      <input type="checkbox" [(ngModel)]="sendWhatsapp">
      Enviar WhatsApp (futuro)
    </label>

    <div class="field">
      <label>Recordar antes</label>
      <select [(ngModel)]="reminderMinutesBefore">
        <option [value]="1440">24 horas</option>
        <option [value]="2880">48 horas</option>
      </select>
    </div>

    <p class="warning">
      ⚠️ Cancelaciones con menos de 24 horas pueden generar sanciones.
    </p>

    <div *ngIf="error" class="error">
      {{ error }}
      {{ error }}
    </div>

    <div class="actions">
      <button (click)="cancel()">Cancelar</button>
      <button [disabled]="saving" (click)="save()">Guardar cita</button>
      <button
        *ngIf="editMode"
        class="text-red-600 border border-red-300 hover:bg-red-50"
        (click)="cancelAppointment()"
      >
        Cancelar cita
      </button>

    </div>

  </div>
</div>
