<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Iniciar sesión — Odontoweb</title>
  <!-- Tailwind CDN (solo para desarrollo) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center">
<div class="w-full max-w-md p-6 bg-white rounded-xl shadow">
  <div class="mb-4 text-center">
    <h1 class="text-2xl font-bold text-slate-900">Please sign in</h1>
    <p class="text-sm text-slate-500 mt-1">Accede con tu correo y contraseña</p>
  </div>

  <!-- Formulario POST a /login (Spring por defecto lo procesa) -->
  <form method="post" action="/login" class="space-y-4">
    <input name="username" type="text" placeholder="Correo electrónico"
           class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" required/>
    <input name="password" type="password" placeholder="Password"
           class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" required/>
    <div class="flex items-center justify-between">
      <a href="http://localhost:4200" class="text-sm text-slate-600 hover:underline">← Volver a la página pública</a>
      <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Sign in</button>
    </div>
  </form>

  <div class="text-xs text-slate-400 mt-4 text-center">
    Si olvidaste tu contraseña contacta al administrador.
  </div>
</div>
</body>
</html>
